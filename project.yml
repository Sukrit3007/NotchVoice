name: NotchVoice
options:
  bundleIdPrefix: com.sukrit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  NotchVoiceCore:
    path: Core

targets:
  NotchVoice:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "NotchVoice.entitlements"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: NotchVoiceCore
        product: NotchVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sukrit.notchvoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # TEMPORARY: ad-hoc signing. Must become a real Apple Development identity
        # before Task 6 — TCC grants (Microphone, Accessibility, Input Monitoring)
        # are keyed to the signing identity, and ad-hoc signing changes it on every
        # rebuild, silently revoking them.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NotchVoice.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
