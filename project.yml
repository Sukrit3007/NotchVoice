name: NotchVoice
options:
  bundleIdPrefix: com.sukrit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  NotchVoiceCore:
    path: Core

targets:
  NotchVoice:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "NotchVoice.entitlements"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: NotchVoiceCore
        product: NotchVoiceCore
    settings:
      base:
        # The shipped app is "Notch Voice" — .app filename and executable
        # included. The target and scheme stay `NotchVoice` because those are
        # only ever typed, never seen.
        PRODUCT_NAME: Notch Voice
        # Required once PRODUCT_NAME contains a space: the Swift module name is
        # derived from the product name by default, and "Notch Voice" is not a
        # valid identifier. Without this the build fails.
        PRODUCT_MODULE_NAME: NotchVoice
        # Unchanged, deliberately. Reverse-DNS identifiers do not take spaces,
        # and this one also keys `UserDefaults` — moving it would silently reset
        # the saved key binding and the sound preference.
        PRODUCT_BUNDLE_IDENTIFIER: com.sukrit.notchvoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 6.2 for SE-0459 (`enumerated()` as a Collection), used by WaveformView.
        SWIFT_VERSION: "6.2"
        # Signing must stay stable across rebuilds: TCC grants (Microphone,
        # Accessibility, Input Monitoring) are keyed to the signing identity,
        # and ad-hoc signing changes it every build, silently revoking them.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CZ25Y34MGF
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NotchVoice.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    scheme:
      testTargets:
        - NotchVoiceTests

  # Anything that needs AppKit, the app's own types, or the built bundle's
  # resources. Pure logic belongs in Core, which tests without an app host.
  NotchVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: NotchVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sukrit.notchvoice.tests
        SWIFT_VERSION: "6.2"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        # Hosted in the app so `Bundle.main` is the real bundle and the cue
        # assets can be asserted against what actually ships. The app skips
        # starting its pipeline when it detects it is hosting tests.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notch Voice.app/Contents/MacOS/Notch Voice"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CZ25Y34MGF
